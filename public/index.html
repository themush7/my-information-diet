<style>

  --pill-on-fg: #000000;

  --card-line: rgba(243, 239, 231, 0.14);

*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.app { position: relative; display: flex; flex-direction: column; height: 100%; min-height: 560px; }

/* Header */
.head { position: relative; z-index: 3; width: 100%; max-width: 64rem; margin: 0 auto; padding: 1.5rem 1rem 0; }
@media (min-width: 640px) { .head { padding: 2rem 2rem 0; } }
.title {
  margin: 0;
  font-family: var(--font-head);
  font-weight: 700;
  font-size: clamp(2.9rem, 9vw, 5.2rem);
  line-height: 0.9;
  letter-spacing: 0.005em;
  animation: rise 900ms cubic-bezier(.2,.7,.2,1) both;
}
.title .arrow {
  display: inline-block; width: 0.5em; height: 0.66em; margin-left: 0.18em;
  color: var(--doodle); vertical-align: top; transform: translateY(0.12em) rotate(-10deg);
  opacity: 0.85;
}
.title .arrow path { stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw 900ms 700ms ease-out forwards; }
.byline { margin: 0.35rem 0 0; font-family: var(--font-hand); font-size: 1.05rem; color: var(--muted); animation: rise 900ms 120ms cubic-bezier(.2,.7,.2,1) both; }
.meta { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 0.9rem; animation: rise 900ms 220ms cubic-bezier(.2,.7,.2,1) both; }
.count { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.22em; color: var(--muted); }
.surprise {
  display: inline-flex; align-items: center; gap: 0.5rem; height: 36px; padding: 0 14px;
  border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--fg);
  font: 500 12px/1 var(--font-ui); text-transform: uppercase; letter-spacing: 0.16em; cursor: pointer;
  transition: border-color 200ms, background-color 200ms, color 200ms;
}
.surprise:hover { border-color: var(--fg); }
.surprise[data-busy] { background: var(--pill-on-bg); color: var(--pill-on-fg); border-color: var(--pill-on-bg); }
.surprise svg { width: 14px; height: 14px; }
.pills {
  display: flex; gap: 8px; margin: 0.9rem -1rem 0; padding: 4px 1rem 6px; overflow-x: auto;
  scrollbar-width: none; animation: rise 900ms 320ms cubic-bezier(.2,.7,.2,1) both;
}
.pills::-webkit-scrollbar { display: none; }
@media (min-width: 640px) { .pills { flex-wrap: wrap; margin: 0.9rem 0 0; padding: 4px 0 6px; overflow: visible; } }
.pill {
  flex: 0 0 auto; padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px;
  background: transparent; color: var(--fg); cursor: pointer; white-space: nowrap;
  font: 500 12px/1.3 var(--font-ui); text-transform: uppercase; letter-spacing: 0.14em;
  transition: background-color 250ms, color 250ms, border-color 250ms;
}
.pill:hover { border-color: var(--fg); }
.pill[aria-pressed="true"] { background: var(--pill-on-bg); color: var(--pill-on-fg); border-color: var(--pill-on-bg); }
.pill .dot { display: inline-block; width: 6px; height: 6px; margin-left: 6px; border-radius: 50%; background: var(--accent); vertical-align: 1px; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

.socials { position: absolute; top: calc(1.25rem + env(safe-area-inset-top, 0px)); right: 1rem; z-index: 4; display: flex; flex-direction: column; gap: 2px; }
@media (min-width: 640px) { .socials { right: 2rem; top: calc(2rem + env(safe-area-inset-top, 0px)); } }
.socials a { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: var(--muted); transition: color 200ms; }
.socials a:hover { color: var(--fg); }
.socials svg { width: 21px; height: 21px; }

/* Stage */
.stage { position: relative; flex: 1 1 auto; min-height: 320px; margin-top: 0.25rem; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.stage::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background:
    linear-gradient(to bottom, var(--bg) 0, transparent 9%, transparent 86%, var(--bg) 100%),
    radial-gradient(ellipse 70% 78% at 50% 48%, transparent 58%, var(--bg) 100%);
}
.hint {
  position: absolute; left: 50%; bottom: 0.9rem; transform: translateX(-50%); z-index: 2; margin: 0;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--muted);
  white-space: nowrap; transition: opacity 300ms; pointer-events: none;
}
.namelabel {
  position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; opacity: 0;
  padding: 6px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--card-line);
  font: 500 12px/1.2 var(--font-ui); letter-spacing: 0.06em; color: var(--fg); white-space: nowrap;
  transform: translate(-50%, -130%); transition: opacity 160ms;
}
.namelabel.say { font-family: var(--font-hand); font-size: 17px; letter-spacing: 0; padding: 3px 14px 5px; }
.loading {
  position: absolute; inset: 0; display: grid; place-items: center; z-index: 2;
  font-family: var(--font-hand); color: var(--muted); font-size: 1rem; transition: opacity 500ms;
}
.loading[hidden] { display: none; }
.foot { display: none; }
.count, .surprise { white-space: nowrap; }
@media (max-width: 420px) {
  .count { font-size: 11px; letter-spacing: 0.16em; }
  .surprise { padding: 0 12px; letter-spacing: 0.12em; }
}
@media (min-width: 1024px) {
  .app { display: grid; grid-template-columns: minmax(380px, 36%) 1fr; grid-template-rows: 1fr auto; }
  .head { grid-column: 1; grid-row: 1; align-self: center; max-width: 34rem; margin: 0; padding: 3rem 1rem 2rem 3rem; }
  .title { font-size: clamp(3.6rem, 5.4vw, 5.8rem); }
  .meta { margin-top: 1.6rem; }
  .pills { margin-top: 1.2rem; }
  .stage { grid-column: 2; grid-row: 1 / span 2; margin: 0; }
  .stage::after { background: linear-gradient(to right, var(--bg) 0, transparent 14%), linear-gradient(to bottom, var(--bg) 0, transparent 8%, transparent 88%, var(--bg) 100%), radial-gradient(ellipse 75% 80% at 50% 50%, transparent 60%, var(--bg) 100%); }
  .foot { display: block; grid-column: 1; grid-row: 2; padding: 0 1rem 1.6rem 3rem; font-size: 11px; text-transform: uppercase; letter-spacing: 0.22em; color: var(--muted); }
}

/* Fallback list (no WebGL) */
.fallback { position: absolute; inset: 0; overflow-y: auto; padding: 1rem; z-index: 2; }
.fallback[hidden] { display: none; }
.fallback h2 { font-family: var(--font-head); font-size: 2rem; margin: 1.2rem 0 0.5rem; font-weight: 700; }
.fallback ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.fallback button {
  width: 100%; display: flex; gap: 12px; align-items: center; text-align: left; padding: 12px;
  border: 1px solid var(--card-line); border-radius: 16px; background: var(--card); color: var(--fg); cursor: pointer;
}
.fallback img { width: 48px; height: 48px; border-radius: 50%; flex: none; }
.fallback strong { display: block; font-family: var(--font-serif); font-weight: 600; font-size: 1.05rem; }
.fallback span { font-family: var(--font-hand); font-size: 0.9rem; color: var(--muted); }

/* Detail card */
.card {
  position: fixed; z-index: 10; background: var(--card); color: var(--fg);
  border: 1px solid var(--card-line); box-shadow: 0 24px 60px rgba(0,0,0,0.35);
  transition: transform 520ms cubic-bezier(.2,.8,.2,1), opacity 300ms;
  left: 0; right: 0; bottom: 0; border-radius: 22px 22px 0 0;
  padding: 18px 20px calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translateY(105%); opacity: 0; max-height: 62%; overflow-y: auto;
}
.card.open { transform: translateY(0); opacity: 1; }
@media (min-width: 860px) {
  .card {
    left: auto; right: 28px; bottom: auto; top: 50%; width: 370px; border-radius: 22px;
    padding: 22px 24px 20px; max-height: calc(100% - 64px);
    transform: translate(calc(100% + 60px), -50%);
  }
  .card.open { transform: translate(0, -50%); }
}
.card-grip { width: 36px; height: 4px; border-radius: 4px; background: var(--card-line); margin: -4px auto 14px; }
@media (min-width: 860px) { .card-grip { display: none; } }
.card-top { display: flex; align-items: center; gap: 14px; }
.card-photo { width: 64px; height: 64px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px var(--card-line); }
.card-shelf { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--muted); }
.card h2 { margin: 2px 0 0; font-family: var(--font-serif); font-weight: 600; font-size: 1.6rem; line-height: 1.1; }
.card-where { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.card-new { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: #1c140a; font: 500 10px/1.5 var(--font-ui); letter-spacing: 0.14em; text-transform: uppercase; vertical-align: 4px; }
.card-note { margin: 16px 0 0; font-family: var(--font-hand); font-size: 1.12rem; line-height: 1.55; }
.card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px;
  border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg);
  font: 500 13px/1 var(--font-ui); text-decoration: none; cursor: pointer; transition: border-color 200ms, opacity 200ms;
}
.btn:hover { border-color: var(--fg); }
.btn.primary { background: var(--pill-on-bg); color: var(--pill-on-fg); border-color: var(--pill-on-bg); }

.btn svg { width: 16px; height: 16px; }
.card-nav { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--card-line); }

.card.extra .card-nav .btn:not(.card-close) { display: none; }
.pill[hidden] { display: none; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 20;

  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; }

}
</style>

              world.add(tag);
              tm.material.forEach(m => o.mats.push(m));
              const thit = new T.Mesh(new T.BoxGeometry(TAG_W, TAG_H, 0.04), new T.MeshBasicMaterial({ visible: false }));
              thit.position.set(0, TAG_H / 2, 0); thit.userData.creator = c; tilt.add(thit); hitTargets.push(thit);
            }
            if (isNew(c)) {
              const st = new T.Mesh(new T.CircleGeometry(0.034, 32), matStd({ map: sticker, roughness: 0.6, envMapIntensity: 0.3 }));
              st.position.set(o.w / 2 - 0.035, o.h - 0.035, 0.004); st.rotation.z = -0.25; o.group.add(st);
            }
            o.mats.forEach(m => { m.userData.base = m.color.clone(); });
            creatorObjs.set(c.id, { c, o, pivot, hit, tag, fy, cx, hover: 0, dim: 1, baseZ: zB });
          }
          cursor += e.w + gap;
        });
        const lc = labelCanvas(s.label);
        const frac = lc.labelWidth / lc.width;
        const lt = tex(lc); lt.repeat.set(frac, 1);
        const LH = 0.12, LW = LH * (lc.width / lc.height) * frac;
        const label = new T.Mesh(new T.PlaneGeometry(LW, LH), matStd({ map: lt, transparent: true, roughness: 0.9, envMapIntensity: 0.2 }));
        label.position.set(-IW / 2 + 0.06 + LW / 2, fy + HI - 0.13, -D / 2 + BACK + 0.002);
        label.rotation.z = (R() - 0.5) * 0.04; label.receiveShadow = true;
        world.add(label);
        const sh = new T.Mesh(new T.BoxGeometry(IW, HI, D), new T.MeshBasicMaterial({ visible: false }));
        sh.position.set(0, fy + HI / 2, 0); sh.userData.shelf = i; world.add(sh); shelfHits.push(sh);
      });
    }

    /* ---------- camera ---------- */
    const cam = { target: new T.Vector3(0, TOP / 2, 0), dist: 8, offX: 0, offY: 0 };
    const goal = { target: new T.Vector3(0, TOP / 2, 0), dist: 6, offX: 0, offY: 0 };
    let size = { w: 1, h: 1 };
    const pointer = { x: 0, y: 0, sx: 0, sy: 0, inside: false };

    function cardOverlap() {
      if (!card.classList.contains('open')) return { x: 0, y: 0 };
      if (window.innerWidth >= 860) return { x: card.offsetWidth + 40, y: 0 };
      const st = stage.getBoundingClientRect();
      const ch = Math.min(card.scrollHeight, window.innerHeight * 0.62);
      return { x: 0, y: Math.max(0, st.bottom - (window.innerHeight - ch)) };
    }
    function fit(w, h, ov) {
      const t = Math.tan(T.MathUtils.degToRad(camera.fov / 2));
      const effW = Math.max(120, size.w - ov.x), effH = Math.max(120, size.h - ov.y);
      const aspect = size.w / size.h;
      return Math.max((h / 2) / (t * (effH / size.h)), (w / 2) / (t * aspect * (effW / size.w)));
    }
    function clampPan(fitW) {
      const lim = Math.max(0, (W - fitW) / 2 + 0.08);
      state.panX = Math.max(-lim, Math.min(lim, state.panX));
    }
    function computeGoal() {
      const ov = cardOverlap();
      goal.offX = ov.x / 2; goal.offY = ov.y / 2;
      if (state.mode === 'creator' && current && creatorObjs.has(current.id)) {
        const e = creatorObjs.get(current.id);
        const extra = e.tag ? 0.2 : 0;
        goal.target.set(e.cx + extra / 2, e.fy + e.o.h / 2 + 0.01, 0);
        goal.dist = Math.max(1.05, fit(e.o.w + extra + 0.85, e.o.h + 0.5, ov));
      } else if (state.mode === 'extra') {
        goal.target.set(-0.15, TOP + 0.17, 0);
        goal.dist = Math.max(0.9, fit(0.85, 0.5, ov));
      } else if (state.mode === 'top') {
        const fitW = narrow() ? 0.95 : 1.2;
        clampPan(fitW);
        goal.target.set(state.panX, TOP + 0.14, 0);
        goal.dist = fit(fitW, 0.42, ov);
      } else if (state.mode === 'shelf' && state.shelf >= 0) {
        const fitW = narrow() ? 1.25 : W + 0.25;
        clampPan(fitW);
        goal.target.set(state.panX, floorY(state.shelf) + HI / 2 - 0.01, 0);
        goal.dist = fit(fitW, HI + 0.32, ov);
      } else {
        goal.target.set(0, (TOP + 0.5) / 2 - 0.06, 0);
        goal.dist = fit(W + 0.3, TOP + 0.5 + 0.62, ov);
      }
    }
    function resize() {
      const r = stage.getBoundingClientRect();
      size = { w: Math.max(1, Math.round(r.width)), h: Math.max(1, Math.round(r.height)) };
      renderer.setSize(size.w, size.h, false);
      camera.aspect = size.w / size.h; camera.updateProjectionMatrix();
      computeGoal(); setHint();
    }

    goAll = () => { state.mode = 'all'; state.shelf = -1; setPills(); computeGoal(); setHint(); };
    goTop = () => { state.mode = 'top'; state.shelf = -1; state.panX = narrow() ? -0.72 : -0.66; setPills(); computeGoal(); setHint(); setHash('desk'); };
    goShelf = (i) => { if (i < 0) return goAll(); if (state.shelf !== i || state.mode !== 'shelf') state.panX = 0; state.mode = 'shelf'; state.shelf = i; setPills(); computeGoal(); setHint(); };
    openCreator = (c) => {
      current = c; currentExtra = null; state.mode = 'creator'; state.shelf = shelfIndex(c.shelf); setPills();
      fillCard(c); showCard(); $('#live').textContent = c.name + ' opened'; setHash(c.id);
      requestAnimationFrame(() => { computeGoal(); setHint(); });
    };
    openMusic = () => {
      current = null; currentExtra = 'music'; state.mode = 'extra'; setPills();
      fillMusicCard(musicSleeveURL); showCard(); $('#live').textContent = 'Music card opened';
      requestAnimationFrame(() => { computeGoal(); setHint(); });
    };
    closeCreator = () => {
      const wasExtra = !!currentExtra;
      const s = current ? shelfIndex(current.shelf) : -1;
      hideCard(); current = null; currentExtra = null;
      if (wasExtra) { goTop(); return; }
      if (s >= 0) { state.mode = 'shelf'; state.shelf = s; setHash(shelves[s].id); } else { state.mode = 'all'; setHash(''); }
      setPills(); computeGoal(); setHint();
    };
    setFocus = (c) => { state.focus = c; };

    /* ---------- picking ---------- */
    const ray = new T.Raycaster(); const ndc = new T.Vector2();
    function pick(clientX, clientY) {
      const r = canvas.getBoundingClientRect();
      ndc.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      const hit = ray.intersectObjects(hitTargets, false)[0];
      if (hit) return hit.object.userData.creator ? { creator: hit.object.userData.creator } : { extra: hit.object.userData.extra };
      const sh = ray.intersectObjects(shelfHits, false)[0];
      if (sh) return { shelf: sh.object.userData.shelf };
      return {};
    }
    function wobble() { bobble.t0 = clock.elapsedTime; bobble.hiUntil = performance.now() + 1800; bobble.hiFrames = 4; }
    let down = null;
    canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, lx: e.clientX, t: performance.now(), drag: false }; });
    canvas.addEventListener('pointermove', e => {
      if (down && e.pointerType !== 'mouse' && (state.mode === 'shelf' || state.mode === 'top') && narrow()) {
        const tdx = e.clientX - down.x, tdy = e.clientY - down.y;
        if (!down.drag && Math.abs(tdx) > 10 && Math.abs(tdx) > Math.abs(tdy)) down.drag = true;
        if (down.drag) {
          const perPx = 2 * cam.dist * Math.tan(T.MathUtils.degToRad(camera.fov / 2)) * camera.aspect / size.w;
          state.panX -= (e.clientX - down.lx) * perPx;
          computeGoal(); cam.target.x = goal.target.x;
        }
        down.lx = e.clientX;
      }
      const r = stage.getBoundingClientRect();
      pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1; pointer.y = ((e.clientY - r.top) / r.height) * 2 - 1; pointer.inside = true;
      if (e.pointerType === 'mouse') {
        const p = pick(e.clientX, e.clientY);
        const next = p.creator || p.extra || null;
        state.hover = next;
        canvas.style.cursor = (next || (state.mode === 'all' && p.shelf !== undefined && narrow())) ? 'pointer' : 'default';
      }
    });
    canvas.addEventListener('pointerleave', () => { state.hover = null; pointer.inside = false; });
    canvas.addEventListener('pointerup', e => {
      if (!down) return;
      const dx = e.clientX - down.x, dy = e.clientY - down.y; const d0 = down; down = null;
      if (d0.drag) return;
      if (Math.abs(dy) > 50 && Math.abs(dy) > Math.abs(dx) * 1.2 && e.pointerType !== 'mouse') { swipe(dy < 0 ? 1 : -1); return; }
      if (Math.hypot(dx, dy) > 8 || performance.now() - d0.t > 700) return;
      const p = pick(e.clientX, e.clientY);
      if (p.extra) {
        if (state.mode === 'all') { state.filterNew = false; goTop(); if (p.extra === 'bobble') wobble(); return; }
        if (p.extra === 'bobble') { wobble(); return; }
        if (p.extra === 'music') { openMusic(); return; }
      }
      if (p.creator) {
        if (state.mode === 'all' && narrow()) { state.filterNew = false; goShelf(shelfIndex(p.creator.shelf)); setHash(p.creator.shelf); }
        else openCreator(p.creator);
      } else if (p.shelf !== undefined) {
        if (current || currentExtra) closeCreator();
        else if (state.mode === 'all' || state.mode === 'top' || state.mode === 'shelf') {
          state.filterNew = false;
          if (p.shelf === 'top') { if (state.mode !== 'top') goTop(); }
          else if (!(state.mode === 'shelf' && state.shelf === p.shelf)) { goShelf(p.shelf); setHash(shelves[p.shelf].id); }
        }
      } else if (current || currentExtra) closeCreator();
    });
    function swipe(dir) {
      if (current || currentExtra) return;
      if (state.mode === 'all') { if (dir > 0) { state.filterNew = false; goTop(); } return; }
      if (state.mode === 'top') {
        if (dir > 0) { goShelf(0); setHash(shelves[0].id); } else { goAll(); setHash(''); }
        return;
      }
      const next = state.shelf + dir;
      if (next < 0) { goTop(); return; }
      if (next >= N) return;
      goShelf(next); setHash(shelves[next].id);
    }
    let wheelAcc = 0, wheelLock = 0;
    stage.addEventListener('wheel', e => {
      if (current || currentExtra || e.ctrlKey) return;
      e.preventDefault();
      const now = performance.now(); if (now < wheelLock) return;
      wheelAcc += e.deltaY;
      if (Math.abs(wheelAcc) > 60) { swipe(wheelAcc > 0 ? 1 : -1); wheelAcc = 0; wheelLock = now + 650; }
    }, { passive: false });

    /* ---------- loop ---------- */
    const label = $('#namelabel');
    const tmpV = new T.Vector3();
    const clock = new T.Clock();
    let first = true;
    function frame() {
      const dt = Math.min(0.05, clock.getDelta());
      const t = clock.elapsedTime;
      const reduce = reduceMotionMq.matches;
      const k = reduce ? 1 : 1 - Math.exp(-dt * 3.6);
      cam.target.lerp(goal.target, k);
      cam.dist += (goal.dist - cam.dist) * k;
      cam.offX += (goal.offX - cam.offX) * k;
      cam.offY += (goal.offY - cam.offY) * k;
      const pk = reduce ? 1 : 1 - Math.exp(-dt * 2.5);
      pointer.sx += ((pointer.inside ? pointer.x : 0) - pointer.sx) * pk;
      pointer.sy += ((pointer.inside ? pointer.y : 0) - pointer.sy) * pk;
      const drift = reduce ? 0 : 1;
      const px = (pointer.sx * 0.05 + Math.sin(t * 0.21) * 0.012 * drift) * cam.dist;
      const py = (-pointer.sy * 0.03 + Math.sin(t * 0.17) * 0.008 * drift) * cam.dist;
      const elev = state.mode === 'all' ? 0.07 : 0.11;
      camera.position.set(cam.target.x + px, cam.target.y + cam.dist * elev + py, cam.target.z + cam.dist);
      camera.lookAt(cam.target.x + px * 0.3, cam.target.y + py * 0.3, cam.target.z);
      camera.setViewOffset(size.w, size.h, cam.offX, cam.offY, size.w, size.h);

      if (bobble.head) {
        const since = t - bobble.t0;
        const big = reduce ? 0 : bobble.amp * Math.exp(-since * 1.6) * Math.sin(since * 11);
        const idle = reduce ? 0 : Math.sin(t * 1.7) * 0.025;
        bobble.head.rotation.z = big * 0.8 + idle;
        bobble.head.rotation.x = big * 0.5 + Math.sin(t * 1.3 + 1) * 0.015 * (reduce ? 0 : 1);
      }

      const focusC = state.focus && document.activeElement && document.activeElement.closest && document.activeElement.closest('#sr-list') ? state.focus : null;
      const hl = (state.hover && typeof state.hover === 'object') ? state.hover : focusC;
      creatorObjs.forEach(e => {
        const target = (hl === e.c || current === e.c) ? 1 : 0;
        e.hover += (target - e.hover) * (reduce ? 1 : 1 - Math.exp(-dt * 10));
        e.pivot.position.z = e.baseZ + e.hover * 0.04;
        e.pivot.position.y = e.fy + e.hover * 0.008;
        e.pivot.rotation.x = -e.o.lean * (1 - 0.55 * e.hover);
        const dimT = state.filterNew && state.mode === 'all' && !isNew(e.c) ? 0.14 : 1;
        if (Math.abs(dimT - e.dim) > 0.002) {
          e.dim += (dimT - e.dim) * (reduce ? 1 : 1 - Math.exp(-dt * 6));
          e.o.mats.forEach(m => { if (m.userData.base) m.color.copy(m.userData.base).multiplyScalar(e.dim); });
        }
      });

      renderer.render(scene, camera);

      let lbl = null;
      if (hl && creatorObjs.has(hl.id) && state.mode !== 'creator') { const e = creatorObjs.get(hl.id); lbl = { hit: e.hit, h: e.o.h, text: hl.name }; }
      else if (typeof state.hover === 'string' && extraObjs.has(state.hover) && state.mode !== 'extra') { const x = extraObjs.get(state.hover); lbl = { hit: x.hit, h: x.h, text: x.label }; }
      const showHi = performance.now() < bobble.hiUntil || bobble.hiFrames > 0;
      if (bobble.hiFrames > 0) bobble.hiFrames--;
      if (showHi && extraObjs.has('bobble')) { const x = extraObjs.get('bobble'); lbl = { hit: x.hit, h: x.h, text: 'hi', say: true }; }
      else if (lbl && !lbl.text) lbl = null;
      if (lbl) {
        label.classList.toggle('say', !!lbl.say);
        lbl.hit.getWorldPosition(tmpV); tmpV.y += lbl.h / 2 + 0.02; tmpV.project(camera);
        label.style.left = ((tmpV.x + 1) / 2 * size.w) + 'px';
        label.style.top = ((1 - tmpV.y) / 2 * size.h) + 'px';
        if (label.textContent !== lbl.text) label.textContent = lbl.text;
        label.style.opacity = '1';
      } else label.style.opacity = '0';

      if (first) { first = false; $('#loading').hidden = true; }
      requestAnimationFrame(frame);
    }

    buildWorld();
    resize();
    cam.target.copy(goal.target).add(new T.Vector3(0, 0.6, 0));
    cam.dist = goal.dist * 1.45;
    new ResizeObserver(() => resize()).observe(stage);
    window.addEventListener('resize', resize);
    const rebuild = () => { buildWorld(); computeGoal(); };
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rebuild);
    new MutationObserver(rebuild).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    card.addEventListener('transitionend', computeGoal);
    handleInitialHash();
    requestAnimationFrame(frame);
  }

  start();
})();
</script>
</body>
</html>
